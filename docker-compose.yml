services:
  yarn:
    build:
      context: .
      dockerfile: docker_files/yarn.Dockerfile
    volumes:
      - ./app:/app
    stdin_open: true
    tty: true
  nest:
    build:
      context: .
      dockerfile: docker_files/nest.Dockerfile
    volumes:
      - ./:/app
    stdin_open: true
    tty: true
  database:
    container_name: database
    image: mysql:8.0
    env_file:
      - env/mysql.env
    ports:
      - 3306:3306
  app:
    container_name: app
    build:
      context: .
      dockerfile: docker_files/app.Dockerfile
    ports:
      - 3000:3000
    volumes:
      - ./app/src:/app/src
    command: ["yarn", "run", "start:dev"]
